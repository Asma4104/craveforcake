<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery — Crave for Cake</title>
<meta name="description" content="A look at cakes, brownies, cupcakes and custom orders from Crave for Cake.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Jost:ital,wght@0,200..600;1,300..500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/images/favicon.png">
<link rel="apple-touch-icon" href="assets/images/logo-mark.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-nav"></div>

<header class="pagehead">
  <div class="wrap">
    <span class="eyebrow">Gallery</span>
    <h1>Our work, up close</h1>
    <p class="lede">Tap any image to open it full size. Every photograph here is a placeholder, ready to be swapped for your own.</p>
  </div>
  <div class="scallop scallop--cream pagehead__scallop" aria-hidden="true"></div>
</header>

<section class="section">
  <div class="wrap">
    <div class="filters" id="galleryFilters" role="group" aria-label="Filter gallery"></div>
    <div class="masonry" id="galleryGrid"></div>
  </div>
</section>

<div class="scallop scallop--espresso" aria-hidden="true"></div>
<section class="cta-band">
  <div class="wrap">
    <span class="eyebrow">Seen one you like?</span>
    <h2>We can bake it <em>for your date</em></h2>
    <p>Send us a reference, a colour or a theme and we'll design a cake around it.</p>
    <div class="cta-band__actions">
      <a class="btn btn--light" href="order.html">Start an order</a>
      <a class="btn btn--ghost" href="menu.html" style="color:var(--cream);border-color:rgba(253,248,244,.35)">Browse the menu</a>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
